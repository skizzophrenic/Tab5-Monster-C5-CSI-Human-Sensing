; Tab5 Monster C5 CSI Human Sensing
;
; Two firmwares from one repo:
;   tab5       the M5Stack Tab5 (ESP32-P4): the four sensing screens
;   monster-c5 the C5Lab M5MonsterC5 (ESP32-C5) on the Tab5's M5-Bus: the
;              listening radio that measures the WiFi channel (CSI)
;
; Both use the pioarduino platform (ESP32-P4 and ESP32-C5 need Arduino core 3).
; Pinned: an unpinned platform moves under you.

[platformio]
default_envs = tab5, monster-c5
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; The release version, on the console at boot and in the radio's $I line.
version_flag = -DFIRMWARE_VERSION=\"1.0.0-beta\"

[env:tab5]
extra_scripts = pre:tools/patch_tft_espi_p4.py
board = tab5
board_build.partitions = partitions_tab5.csv
upload_speed = 1500000
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    m5stack/M5GFX@^0.2.33
build_src_filter = +<app/>
build_flags =
    -DTAB5=1
    -DSERIAL_BAUD=115200
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/tab5_user_setup.h
    -DSQW_BG_MAX_W=640
    -DSQW_BG_DENSITY=2
    ${env.version_flag}

[env:monster-c5]
board = esp32-c5-devkitc1-n8r4
board_build.partitions = partitions_monster_c5.csv
build_src_filter = +<radio/>
build_flags =
    -DSENSE_C5=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSERIAL_BAUD=115200
    -DCORE_DEBUG_LEVEL=1
    ${env.version_flag}
